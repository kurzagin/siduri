<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siduri — Livestream Overlay</title>
<style>
/* ==========================================================================
   TOKENS — palette, type, spacing
   ========================================================================== */
:root{
  --near-black: #0a0906;
  --ivory: #ece4d2;
  --ivory-dim: #a89f8c;
  --venus-gold: #cf9f56;
  --venus-gold-bright: #f0c67e;
  --lapis: #3d5a92;
  --lapis-bright: #6f8fd6;
  --bronze: #8a6a45;

  --font-serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;

  --safe: 70px;

  /* per-state animation variables — overridden by [data-state="..."] below */
  --ring1-dur: 70s;
  --ring2-dur: 95s;
  --ring3-dur: 55s;
  --ring1-angle: -12deg;
  --ring2-angle: 9deg;
  --ring3-angle: -26deg;
  --halo-opacity: 0.34;
  --halo-color: var(--lapis-bright);
  --sphere-band-speed: 140s;
  --sphere-band-opacity: 0.10;
  --light-glow: 0.55;
  --scan-opacity: 0;
  --radial-opacity: 0;
  --pulse-scale: 1;
  --pulse-dur: 6s;
}

*{ box-sizing:border-box; }
html,body{
  margin:0; padding:0;
  width:100%; height:100%;
  background:transparent; /* transparent by default for OBS Browser Source */
  overflow:hidden;
  font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased;
}

/* preview-only near-black background with subtle stars — off by default */
body.preview-bg{
  background:var(--near-black);
}
.preview-stars{
  position:fixed; inset:0;
  pointer-events:none;
  opacity:0;
  transition:opacity .6s ease;
  background-image:
    radial-gradient(1px 1px at 8% 20%, rgba(236,228,210,0.5), transparent 60%),
    radial-gradient(1px 1px at 22% 63%, rgba(236,228,210,0.35), transparent 60%),
    radial-gradient(1px 1px at 41% 12%, rgba(236,228,210,0.4), transparent 60%),
    radial-gradient(1px 1px at 63% 74%, rgba(236,228,210,0.3), transparent 60%),
    radial-gradient(1px 1px at 77% 30%, rgba(236,228,210,0.45), transparent 60%),
    radial-gradient(1px 1px at 88% 58%, rgba(236,228,210,0.3), transparent 60%),
    radial-gradient(1px 1px at 15% 85%, rgba(236,228,210,0.3), transparent 60%),
    radial-gradient(1px 1px at 95% 10%, rgba(236,228,210,0.35), transparent 60%);
  z-index:0;
}
body.preview-bg .preview-stars{ opacity:1; }

/* ==========================================================================
   STAGE — fixed 1920x1080 design canvas, scaled to fit the viewport
   ========================================================================== */
.stage{
  position:absolute;
  top:0; left:0;
  width:1920px; height:1080px;
  transform-origin: top left;
  z-index:1;
}

/* ==========================================================================
   DECORATIVE FRAME — stepped corner brackets + coordinate lines
   (abstract Sumerian reference: ziggurat steps, astronomical scales)
   ========================================================================== */
.frame-brackets{ position:absolute; inset:0; pointer-events:none; opacity:0.55; }
.bracket-corner{ position:absolute; width:46px; height:46px; }
.bracket-corner svg{ width:100%; height:100%; display:block; }
.bracket-corner.tl{ top:var(--safe); left:var(--safe); }
.bracket-corner.tr{ top:var(--safe); right:var(--safe); transform:scaleX(-1); }
.bracket-corner.bl{ bottom:var(--safe); left:var(--safe); transform:scaleY(-1); }
.bracket-corner.br{ bottom:var(--safe); right:var(--safe); transform:scale(-1,-1); }

.coord-lines{
  position:absolute;
  top:44px; left:var(--safe); right:var(--safe);
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(207,159,86,0.35) 8%, rgba(207,159,86,0.35) 92%, transparent);
  opacity:0.5;
  pointer-events:none;
}
.coord-lines::before, .coord-lines::after{
  content:'';
  position:absolute; top:-4px;
  width:1px; height:9px;
  background:rgba(207,159,86,0.5);
}
.coord-lines::before{ left:12%; }
.coord-lines::after{ right:12%; }

/* ==========================================================================
   CONTEXT STRIP — supporting information, top-left, quiet & small
   ========================================================================== */
.context-strip{
  position:absolute;
  top:100px; left:var(--safe);
  display:flex; align-items:center; gap:18px;
  z-index:2;
}
.ctx-field{ display:flex; flex-direction:column; gap:3px; }
.ctx-label{
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--ivory-dim);
}
.ctx-value{
  font-family:var(--font-sans);
  font-size:13px;
  font-weight:500;
  color:var(--ivory);
}
.ctx-sep{
  width:1px; height:22px;
  background:linear-gradient(180deg, transparent, rgba(207,159,86,0.4), transparent);
  position:relative;
}
.ctx-sep::before{
  content:'';
  position:absolute; left:-2px; top:50%; transform:translateY(-50%) rotate(45deg);
  width:4px; height:4px;
  background:var(--venus-gold);
  opacity:0.7;
}

/* ==========================================================================
   SIDURI CORE AREA — status block + Venus core, lower-right
   ========================================================================== */
.siduri-core-area{
  position:absolute;
  right:220px; bottom:170px;
  display:flex; align-items:flex-end; gap:26px;
  z-index:2;
}

/* -- status block -- */
.status-block{
  display:flex; flex-direction:column; align-items:flex-end;
  gap:8px;
  padding-bottom:120px;
  text-align:right;
}
.status-glyph{ width:14px; height:14px; opacity:0.8; }
.status-glyph svg{ width:100%; height:100%; }
.status-name{
  font-family:var(--font-serif);
  font-style:italic;
  font-size:20px;
  letter-spacing:0.04em;
  color:var(--ivory);
}
.status-state{
  display:flex; align-items:center; gap:8px;
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--ivory-dim);
}
.state-dot{
  width:6px; height:6px; border-radius:50%;
  background:var(--venus-gold-bright);
  box-shadow:0 0 8px 2px rgba(240,198,126,0.55);
  transition:background .5s ease, box-shadow .5s ease;
}

/* -- core wrap -- */
.core-wrap{
  position:relative;
  width:420px; height:420px;
  flex-shrink:0;
}

.halo{
  position:absolute;
  left:50%; top:50%;
  width:420px; height:420px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle, rgba(240,198,126,0.28) 0%, transparent 62%);
  opacity:var(--halo-opacity);
  transition:opacity 1.4s ease;
  pointer-events:none;
}

/* orbital rings — flattened ellipses at varying tilt, evoking astronomical diagrams */
.ring-ellipse{
  position:absolute;
  left:50%; top:50%;
  border:1px solid rgba(207,159,86,0.4);
  border-radius:50%;
  pointer-events:none;
}
.ring-1{ width:400px; height:150px; margin:-75px 0 0 -200px; transform:rotate(var(--ring1-angle)); border-color:rgba(111,143,214,0.45); }
.ring-2{ width:330px; height:120px; margin:-60px 0 0 -165px; transform:rotate(var(--ring2-angle)); border-color:rgba(207,159,86,0.4); }
.ring-3{ width:270px; height:96px;  margin:-48px 0 0 -135px; transform:rotate(var(--ring3-angle)); border-color:rgba(207,159,86,0.28); }

.orbit-spin{
  position:absolute; inset:0;
  border-radius:50%;
  animation-name:spin;
  animation-timing-function:linear;
  animation-iteration-count:infinite;
}
.ring-1 .orbit-spin{ animation-duration:var(--ring1-dur); }
.ring-2 .orbit-spin{ animation-duration:var(--ring2-dur); animation-direction:reverse; }
.ring-3 .orbit-spin{ animation-duration:var(--ring3-dur); }

.orbit-light{
  position:absolute;
  top:-3px; left:50%;
  width:6px; height:6px;
  margin-left:-3px;
  border-radius:50%;
  background:var(--venus-gold-bright);
  box-shadow:0 0 10px 3px rgba(240,198,126,var(--light-glow));
  transition:box-shadow .8s ease;
}
.ring-2 .orbit-light{ background:var(--ivory); box-shadow:0 0 8px 2px rgba(236,228,210,var(--light-glow)); }

/* investigating: one light departs its path and returns */
.ring-3 .orbit-light{ animation:none; }
[data-state="investigating"] .ring-3 .orbit-light{
  animation:depart-return 7s ease-in-out infinite;
}
@keyframes depart-return{
  0%, 55%, 100%{ transform:translate(0,0) scale(1); }
  75%{ transform:translate(26px,-34px) scale(1.3); }
}

/* scan arc — used by "observing" */
.scan-arc{
  position:absolute;
  left:50%; top:50%;
  width:300px; height:300px;
  margin:-150px 0 0 -150px;
  border-radius:50%;
  background:conic-gradient(from 0deg, transparent 0deg, rgba(111,143,214,0.85) 14deg, transparent 30deg, transparent 360deg);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 3px), black calc(100% - 3px));
          mask:radial-gradient(farthest-side, transparent calc(100% - 3px), black calc(100% - 3px));
  opacity:var(--scan-opacity);
  transition:opacity 1s ease;
  animation:spin 9s linear infinite;
  pointer-events:none;
}

/* radial lines — brief flourish used by "investigating" */
.radial-burst{
  position:absolute;
  left:50%; top:50%;
  width:360px; height:360px;
  margin:-180px 0 0 -180px;
  border-radius:50%;
  background:repeating-conic-gradient(rgba(240,198,126,0.5) 0deg 1deg, transparent 1deg 30deg);
  -webkit-mask:radial-gradient(farthest-side, transparent 62%, black 64%, black 70%, transparent 74%);
          mask:radial-gradient(farthest-side, transparent 62%, black 64%, black 70%, transparent 74%);
  opacity:var(--radial-opacity);
  transition:opacity 1.2s ease;
  pointer-events:none;
}

/* -- the sphere itself -- */
.sphere{
  position:absolute;
  left:50%; top:50%;
  width:230px; height:230px;
  margin:-115px 0 0 -115px;
  border-radius:50%;
  overflow:hidden;
  transform:scale(var(--pulse-scale));
  transition:transform .3s ease;
  box-shadow:
    0 0 40px 6px rgba(207,159,86,0.28),
    inset -18px -14px 40px rgba(0,0,0,0.55),
    inset 10px 8px 30px rgba(255,244,222,0.18);
}
.sphere-body{
  position:absolute; inset:0;
  background:radial-gradient(circle at 38% 34%, #f6ddab 0%, #e3b46e 30%, #c8905a 58%, #8a5c34 84%, #5a3a20 100%);
}
.sphere-bands{
  position:absolute; inset:-10% -10%;
  background:repeating-linear-gradient(
    4deg,
    rgba(90,58,32,0.16) 0px,
    rgba(90,58,32,0.16) 5px,
    transparent 5px,
    transparent 18px,
    rgba(255,244,222,0.10) 18px,
    rgba(255,244,222,0.10) 22px,
    transparent 22px,
    transparent 40px
  );
  opacity:var(--sphere-band-opacity);
  animation:drift-bands var(--sphere-band-speed) linear infinite;
  mix-blend-mode:overlay;
}
@keyframes drift-bands{
  from{ transform:translateY(0); }
  to{ transform:translateY(-200px); }
}

/* reading: a calm horizontal light band sweeps across the sphere */
.sphere-scanline{
  position:absolute; left:-10%; width:120%; height:14%;
  background:linear-gradient(180deg, transparent, rgba(255,244,222,0.55), transparent);
  top:-20%;
  opacity:0;
  pointer-events:none;
}
[data-state="reading"] .sphere-scanline{
  opacity:1;
  animation:sweep-band 3.6s ease-in-out infinite;
}
@keyframes sweep-band{
  0%{ top:-20%; opacity:0; }
  12%{ opacity:1; }
  50%{ top:52%; opacity:0.9; }
  88%{ opacity:1; }
  100%{ top:118%; opacity:0; }
}

@keyframes spin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }

/* speaking: gentle irregular pulse, like a simulated voice rhythm */
[data-state="speaking"] .sphere{
  animation:voice-pulse var(--pulse-dur) ease-in-out infinite;
}
@keyframes voice-pulse{
  0%{ transform:scale(1); }
  18%{ transform:scale(1.018); }
  32%{ transform:scale(0.997); }
  50%{ transform:scale(1.03); }
  68%{ transform:scale(1.005); }
  84%{ transform:scale(1.015); }
  100%{ transform:scale(1); }
}

/* ==========================================================================
   SUBTITLE PANEL — bottom center, glass surface, gold corner detail
   ========================================================================== */
.subtitle-panel{
  position:absolute;
  left:50%; bottom:96px;
  transform:translate(-50%, 14px);
  width:900px;
  max-width:calc(100% - var(--safe) * 2);
  padding:22px 40px 26px;
  background:linear-gradient(180deg, rgba(16,14,10,0.62), rgba(10,9,6,0.72));
  border:1px solid rgba(207,159,86,0.22);
  border-radius:4px;
  backdrop-filter:blur(6px);
  opacity:0;
  pointer-events:none;
  transition:opacity .7s ease, transform .7s cubic-bezier(.2,.8,.3,1);
  text-align:center;
  z-index:3;
}
.subtitle-panel.visible{
  opacity:1;
  transform:translate(-50%, 0);
}
.subtitle-name{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:0.22em;
  text-transform:uppercase;
  color:var(--venus-gold);
  margin-bottom:10px;
}
.subtitle-text{
  font-family:var(--font-serif);
  font-style:italic;
  font-size:23px;
  line-height:1.5;
  color:var(--ivory);
}
.subtitle-panel .bracket{
  position:absolute;
  width:22px; height:22px;
  opacity:0.75;
}
.subtitle-panel .bracket svg{ width:100%; height:100%; }
.subtitle-panel .bracket-tl{ top:-1px; left:-1px; }
.subtitle-panel .bracket-br{ bottom:-1px; right:-1px; transform:scale(-1,-1); }

/* ==========================================================================
   DEV / PREVIEW PANEL — not part of the broadcast image
   fixed to the real viewport, independent of stage scaling
   ========================================================================== */
.dev-panel{
  position:fixed;
  right:16px; bottom:16px;
  z-index:10;
  background:rgba(10,9,6,0.86);
  border:1px solid rgba(207,159,86,0.3);
  border-radius:8px;
  padding:12px 14px;
  font-family:var(--font-mono);
  color:var(--ivory-dim);
  transition:opacity .3s ease, transform .3s ease;
}
.dev-panel.hidden{
  opacity:0;
  pointer-events:none;
  transform:translateY(8px);
}
.dev-title{
  font-size:10px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  margin-bottom:8px;
  color:var(--venus-gold);
}
.dev-buttons{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:6px;
  margin-bottom:8px;
}
.dev-buttons button{
  appearance:none;
  border:1px solid rgba(255,255,255,0.12);
  background:rgba(255,255,255,0.03);
  color:var(--ivory-dim);
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:0.04em;
  padding:7px 6px;
  border-radius:4px;
  cursor:pointer;
  transition:all .2s ease;
}
.dev-buttons button:hover{ color:var(--ivory); border-color:rgba(255,255,255,0.25); }
.dev-buttons button.active{
  color:#1a1207;
  background:linear-gradient(180deg, var(--venus-gold-bright), var(--venus-gold));
  border-color:transparent;
  font-weight:600;
}
.dev-panel .bg-toggle{
  width:100%;
  appearance:none;
  border:1px solid rgba(255,255,255,0.12);
  background:rgba(255,255,255,0.03);
  color:var(--ivory-dim);
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:0.04em;
  padding:7px 6px;
  border-radius:4px;
  cursor:pointer;
}
.dev-panel .bg-toggle.on{ color:var(--venus-gold-bright); border-color:rgba(207,159,86,0.4); }
.dev-hint{
  margin-top:8px;
  font-size:9px;
  color:rgba(168,159,140,0.7);
  line-height:1.5;
}

/* ==========================================================================
   PER-STATE VARIABLE OVERRIDES
   ========================================================================== */
[data-state="idle"]{
  --ring1-dur:70s; --ring2-dur:95s; --ring3-dur:55s;
  --halo-opacity:0.30; --light-glow:0.4;
}
[data-state="observing"]{
  --ring1-dur:44s; --ring2-dur:60s; --ring3-dur:34s;
  --ring1-angle:-4deg;
  --halo-opacity:0.45; --scan-opacity:1; --light-glow:0.55;
}
[data-state="listening"]{
  --ring1-dur:50s; --ring2-dur:66s; --ring3-dur:20s;
  --halo-opacity:0.42; --light-glow:0.75;
}
[data-state="listening"] .orbit-light{
  animation:soft-pulse 2.4s ease-in-out infinite;
}
[data-state="listening"] .ring-2 .orbit-light{ animation-delay:.5s; }
[data-state="listening"] .ring-3 .orbit-light{ animation-delay:1s; }
@keyframes soft-pulse{
  0%,100%{ filter:brightness(1); }
  50%{ filter:brightness(1.6); }
}
[data-state="reasoning"]{
  --ring1-dur:22s; --ring2-dur:16s; --ring3-dur:28s;
  --halo-opacity:0.6; --light-glow:0.7;
}
[data-state="reasoning"] .orbit-light{
  animation:converge 5s ease-in-out infinite;
}
@keyframes converge{
  0%,100%{ transform:translate(0,0) scale(1); }
  50%{ transform:translate(0, 6px) scale(0.55); opacity:0.6; }
}
[data-state="investigating"]{
  --ring1-dur:30s; --ring2-dur:38s; --ring3-dur:18s;
  --halo-opacity:0.5; --radial-opacity:0.7; --light-glow:0.6;
}
[data-state="reading"]{
  --ring1-dur:60s; --ring2-dur:80s; --ring3-dur:46s;
  --halo-opacity:0.4; --light-glow:0.5;
}
[data-state="advising"]{
  --ring1-angle:-8deg; --ring2-angle:8deg; --ring3-angle:-8deg;
  --ring1-dur:80s; --ring2-dur:80s; --ring3-dur:80s;
  --halo-opacity:0.65; --halo-color:var(--venus-gold-bright); --light-glow:0.65;
}
[data-state="advising"] .halo{
  background:radial-gradient(circle, rgba(240,198,126,0.36) 0%, transparent 62%);
}
[data-state="speaking"]{
  --ring1-dur:36s; --ring2-dur:48s; --ring3-dur:26s;
  --halo-opacity:0.62; --light-glow:0.75; --pulse-dur:5.2s;
}
[data-state="speaking"] .orbit-light{
  animation:speak-react 1.3s ease-in-out infinite;
}
@keyframes speak-react{
  0%,100%{ filter:brightness(1); }
  40%{ filter:brightness(1.5); }
  60%{ filter:brightness(0.9); }
}

@media (prefers-reduced-motion: reduce){
  .orbit-spin, .scan-arc, .sphere-bands, [data-state] .sphere,
  [data-state] .orbit-light{ animation:none !important; }
}
</style>
</head>
<body>

<!-- subtle starfield, only visible when preview background is toggled on -->
<div class="preview-stars" id="previewStars" aria-hidden="true"></div>

<div class="stage" id="stage" data-state="idle">

  <!-- decorative frame: stepped corner brackets + coordinate line -->
  <div class="frame-brackets" aria-hidden="true">
    <div class="bracket-corner tl"><svg viewBox="0 0 46 46"><path d="M0 46 L0 18 L10 18 L10 10 L18 10 L18 0" fill="none" stroke="#cf9f56" stroke-width="1.5"/></svg></div>
    <div class="bracket-corner tr"><svg viewBox="0 0 46 46"><path d="M0 46 L0 18 L10 18 L10 10 L18 10 L18 0" fill="none" stroke="#cf9f56" stroke-width="1.5"/></svg></div>
    <div class="bracket-corner bl"><svg viewBox="0 0 46 46"><path d="M0 46 L0 18 L10 18 L10 10 L18 10 L18 0" fill="none" stroke="#cf9f56" stroke-width="1.5"/></svg></div>
    <div class="bracket-corner br"><svg viewBox="0 0 46 46"><path d="M0 46 L0 18 L10 18 L10 10 L18 10 L18 0" fill="none" stroke="#cf9f56" stroke-width="1.5"/></svg></div>
  </div>
  <div class="coord-lines" aria-hidden="true"></div>

  <!-- context strip: quiet supporting information -->
  <section class="context-strip" aria-hidden="true">
    <div class="ctx-field">
      <span class="ctx-label">Active Domain</span>
      <span class="ctx-value">Blue Archive</span>
    </div>
    <span class="ctx-sep"></span>
    <div class="ctx-field">
      <span class="ctx-label">Task</span>
      <span class="ctx-value">Evaluating beginner progression</span>
    </div>
    <span class="ctx-sep"></span>
    <div class="ctx-field">
      <span class="ctx-label">Source</span>
      <span class="ctx-value">Screen + Web</span>
    </div>
  </section>

  <!-- Siduri core: status label + Venus core with orbital rings -->
  <div class="siduri-core-area">

    <div class="status-block">
      <div class="status-glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="6" fill="none" stroke="#cf9f56" stroke-width="1.4"/><line x1="12" y1="14" x2="12" y2="23" stroke="#cf9f56" stroke-width="1.4"/><line x1="8" y1="19" x2="16" y2="19" stroke="#cf9f56" stroke-width="1.4"/></svg>
      </div>
      <div class="status-name">Siduri</div>
      <div class="status-state">
        <span class="state-dot"></span>
        <span id="stateText">Idle</span>
      </div>
    </div>

    <div class="core-wrap">
      <div class="halo"></div>

      <div class="ring-ellipse ring-1"><div class="orbit-spin"><span class="orbit-light"></span></div></div>
      <div class="ring-ellipse ring-2"><div class="orbit-spin"><span class="orbit-light"></span></div></div>
      <div class="ring-ellipse ring-3"><div class="orbit-spin"><span class="orbit-light"></span></div></div>

      <div class="scan-arc"></div>
      <div class="radial-burst"></div>

      <div class="sphere">
        <div class="sphere-body"></div>
        <div class="sphere-bands"></div>
        <div class="sphere-scanline"></div>
      </div>
    </div>

  </div>

  <!-- subtitle: name label + spoken line -->
  <div class="subtitle-panel" id="subtitlePanel">
    <div class="bracket bracket-tl"><svg viewBox="0 0 22 22"><path d="M0 22 L0 8 L8 0" fill="none" stroke="#cf9f56" stroke-width="1.3"/></svg></div>
    <div class="subtitle-name">Siduri</div>
    <div class="subtitle-text" id="subtitleText"></div>
    <div class="bracket bracket-br"><svg viewBox="0 0 22 22"><path d="M0 22 L0 8 L8 0" fill="none" stroke="#cf9f56" stroke-width="1.3"/></svg></div>
  </div>

</div>

<!-- ==========================================================================
     DEV / PREVIEW PANEL — for local testing only, not part of the broadcast
     ========================================================================== -->
<div class="dev-panel" id="devPanel">
  <div class="dev-title">Preview · press H to hide</div>
  <div class="dev-buttons" id="devButtons">
    <button data-state="idle" data-key="1" class="active">1 Idle</button>
    <button data-state="observing" data-key="2">2 Observe</button>
    <button data-state="listening" data-key="3">3 Listen</button>
    <button data-state="reasoning" data-key="4">4 Reason</button>
    <button data-state="investigating" data-key="5">5 Investig.</button>
    <button data-state="reading" data-key="6">6 Read</button>
    <button data-state="advising" data-key="7">7 Advise</button>
    <button data-state="speaking" data-key="8">8 Speak</button>
  </div>
  <button class="bg-toggle" id="bgToggle">Preview background: off</button>
  <div class="dev-hint">Keys 1–8 switch states · H toggles this panel<br>Add ?controls=0 to the URL to hide on load</div>
</div>

<script>
(function(){
  "use strict";

  /* ------------------------------------------------------------------
     Demo spoken lines per state (per brief's sample content)
     ------------------------------------------------------------------ */
  var LINES = {
    idle:          null,
    observing:     "\u201cI am watching, Zagin.\u201d",
    listening:     null,
    reasoning:     "\u201cThere are several paths. I am weighing them.\u201d",
    investigating: "\u201cAllow me to consult the current records.\u201d",
    reading:       "\u201cI have found the relevant material.\u201d",
    advising:      "\u201cI recommend that you preserve your resources for now.\u201d",
    speaking:      "\u201cYour current progress is sufficient, but the margin remains narrow.\u201d"
  };

  var LABELS = {
    idle:"Idle", observing:"Observing", listening:"Listening",
    reasoning:"Reasoning", investigating:"Investigating", reading:"Reading",
    advising:"Advising", speaking:"Speaking"
  };

  var STATE_ORDER = ["idle","observing","listening","reasoning","investigating","reading","advising","speaking"];

  var stage = document.getElementById('stage');
  var stateText = document.getElementById('stateText');
  var subtitlePanel = document.getElementById('subtitlePanel');
  var subtitleText = document.getElementById('subtitleText');
  var devPanel = document.getElementById('devPanel');
  var devButtons = document.getElementById('devButtons');
  var bgToggle = document.getElementById('bgToggle');

  function setState(name){
    if(!LABELS[name]) return;
    stage.setAttribute('data-state', name);
    stateText.textContent = LABELS[name];

    var line = LINES[name];
    if(line){
      subtitleText.textContent = line;
      subtitlePanel.classList.add('visible');
    } else {
      subtitlePanel.classList.remove('visible');
    }

    var buttons = devButtons.querySelectorAll('button');
    for(var i=0;i<buttons.length;i++){
      buttons[i].classList.toggle('active', buttons[i].getAttribute('data-state') === name);
    }
  }

  devButtons.addEventListener('click', function(e){
    var btn = e.target.closest('button');
    if(!btn) return;
    setState(btn.getAttribute('data-state'));
  });

  bgToggle.addEventListener('click', function(){
    var on = document.body.classList.toggle('preview-bg');
    bgToggle.textContent = 'Preview background: ' + (on ? 'on' : 'off');
    bgToggle.classList.toggle('on', on);
  });

  /* ------------------------------------------------------------------
     Keyboard shortcuts: 1-8 switch state, H toggles the dev panel
     ------------------------------------------------------------------ */
  document.addEventListener('keydown', function(e){
    if(e.key === 'h' || e.key === 'H'){
      devPanel.classList.toggle('hidden');
      return;
    }
    var n = parseInt(e.key, 10);
    if(n >= 1 && n <= 8){
      setState(STATE_ORDER[n-1]);
    }
  });

  /* ------------------------------------------------------------------
     ?controls=0 / ?controls=1 query param
     ------------------------------------------------------------------ */
  var params = new URLSearchParams(window.location.search);
  if(params.get('controls') === '0'){
    devPanel.classList.add('hidden');
  }

  /* ------------------------------------------------------------------
     Scale the fixed 1920x1080 stage to fit the current viewport
     ------------------------------------------------------------------ */
  function rescale(){
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    var offsetX = (window.innerWidth - 1920 * scale) / 2;
    var offsetY = (window.innerHeight - 1080 * scale) / 2;
    stage.style.transform = 'translate(' + offsetX + 'px,' + offsetY + 'px) scale(' + scale + ')';
  }
  window.addEventListener('resize', rescale);
  rescale();

  setState('idle');
})();
</script>
</body>
</html>
